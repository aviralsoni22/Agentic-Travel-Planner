version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: travel_redis
    ports:
      - "6379:6379"

  api:
    build: ./agentic_travel_planner
    container_name: travel_api
    command: uvicorn agentic_travel_planner.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://travel_redis:6379/0
      - PYTHONPATH=/app/src
    env_file:
      - ./agentic_travel_planner/.env
    depends_on:
      - redis
    volumes:
      - ./agentic_travel_planner:/app
      - /app/.venv   

  worker:
    build: ./agentic_travel_planner
    container_name: travel_worker
    command: celery -A agentic_travel_planner.worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://travel_redis:6379/0
      - PYTHONPATH=/app/src
    env_file:
      - ./agentic_travel_planner/.env
    depends_on:
      - redis
    volumes:
      - ./agentic_travel_planner:/app
      - /app/.venv

  frontend:
    image: node:20-alpine
    container_name: travel_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://api:8000  # proxy /api to the api service (compose DNS alias)
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules   # anonymous: keep container's Linux modules, not the host's Windows ones
