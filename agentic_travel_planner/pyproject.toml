[project]
name = "agentic_travel_planner"
version = "0.1.0"
description = "agentic-travel-planner using LangChain + LangGraph"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "celery>=5.6.0",
    "fastapi>=0.121.3",
    "redis>=7.1.0",
    "uvicorn>=0.38.0",
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "langchain-openai>=0.2.0",
]

[project.scripts]
agentic_travel_planner = "agentic_travel_planner.main:run"
run_crew = "agentic_travel_planner.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_travel_planner"]
